# Lefthook quality gates for the agentic-development kit.
#
# Wired per WORKFLOW.md §11 + ADR-0012 (agentic-hooks). Scope is the
# minimum justified set for the kit's reality:
#
# - pre-push: `npm test` is the deterministic gate every commit pushed
#   to origin must pass. The unit + integration suite covers state,
#   install, update, profile, frontmatter, and Windows-path regressions;
#   running it on every push catches regressions before they reach `cli`.
#
# Pre-commit is intentionally minimal — the kit has no lint or
# formatter wired today (no eslint, prettier, or equivalent). Adding
# pre-commit lint/format gates is a separate decision once those tools
# are introduced (own ADR + Task per ADR-0007 §6 scrutiny rule).
#
# Bootstrap: `lefthook install` (one-time, after cloning the repo).
# Bypass policy per WORKFLOW §11 — no `--no-verify`. CI mirrors this
# gate in `.github/workflows/test.yml` across Node 18 / 20 / 22.

pre-push:
  parallel: false
  commands:
    npm-test:
      run: npm test
      stage_fixed: false
